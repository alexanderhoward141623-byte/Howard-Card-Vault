<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Howard Card Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a collector's app. Chase cards fan out behind a compact header, content sits in calm sleeves, navigation lives in a bottom bar on phones and a top bar on wide screens. */
:root{
  color-scheme:dark;
  --ink:#0a0d13; --panel:#131822; --panel2:#1b2230; --line:#252d3c;
  --text:#eef1f6; --muted:#93a0b5;
  --accent:#f28c28;
  --good:#4cc38a; --warn:#f2b84b; --bad:#ef6a6a; --unv:#b9a2f2;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; --nav:64px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ink);color:var(--text);font:400 15px/1.45 var(--body);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#foil{width:100%;height:100%;display:block;opacity:.4}
#chase{position:absolute;inset:-14% -22%;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(118px,25vw,190px),1fr));gap:14px;align-content:start;transform:rotate(-8deg)}
#chase img{width:100%;aspect-ratio:63/88;object-fit:cover;border-radius:10px;opacity:0;transition:opacity .7s;box-shadow:0 8px 24px #000a}
#chase img.in{opacity:.78}
#backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0a0d1366 0,#0a0d13b0 300px,#0a0d13c4 100%)}
.app{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 16px calc(var(--nav) + 96px)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0 12px}
.brand h1{font:800 clamp(21px,6vw,27px)/1 var(--display);white-space:nowrap;margin:0;letter-spacing:-.02em;text-shadow:0 2px 18px #000a}
.brand h1 span{color:var(--accent)}
.brand p{margin:5px 0 0;color:var(--muted);font-size:12.5px;text-shadow:0 1px 8px #000}
.sync{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;background:#131822cc;border:1px solid var(--line);padding:5px 10px;border-radius:999px;white-space:nowrap;backdrop-filter:blur(8px)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.dot.ok{background:var(--good)} .dot.off{background:var(--muted)}
nav.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:8;height:calc(var(--nav) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:center;background:#0d1118f2;border-top:1px solid var(--line);backdrop-filter:blur(14px)}
nav.bottomnav .in{display:flex;width:min(560px,100%)}
nav.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600}
nav.bottomnav a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bottomnav a.on{color:var(--accent)}
.subnav{display:flex;gap:4px;background:#131822d9;border:1px solid var(--line);border-radius:12px;padding:4px;margin:0 0 14px;backdrop-filter:blur(8px)}
.subnav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-weight:600;font-size:13.5px;padding:8px 6px;border-radius:9px;white-space:nowrap}
.subnav a.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
h2{font:800 22px/1.15 var(--display);margin:22px 0 12px;text-wrap:balance;letter-spacing:-.01em;text-shadow:0 2px 12px #000c}
.app>main>p,.app>main>.muted,.sec{text-shadow:0 1px 8px #000}
h3{font:700 15px/1.25 var(--body);margin:0}
.sec{font:700 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scrollx{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips.scrollx::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#131822d9;color:var(--muted);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer;backdrop-filter:blur(8px)}
.chip.on{color:#14100a;background:var(--accent);border-color:var(--accent)}
.chip.ghost{border-style:dashed;background:transparent}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:10px 14px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--text);display:inline-block}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#14100a}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:720px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.tile b{display:block;font:800 23px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted);display:block;margin-top:3px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.stack{display:flex;flex-direction:column;gap:10px}
.list{display:grid;gap:8px}
@media(min-width:900px){.list{grid-template-columns:1fr 1fr}}
.card{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 10px 10px;cursor:pointer;text-align:left;width:100%;color:inherit;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tc,var(--line))}
.thumb{flex:0 0 58px;width:58px;aspect-ratio:63/88;border-radius:7px;background:linear-gradient(150deg,color-mix(in srgb,var(--tc,#888) 30%,#10141c),#0d1118 70%);border:1px solid var(--line);position:relative;overflow:hidden;display:grid;place-items:center;color:color-mix(in srgb,var(--tc,#888) 75%,#fff);font:800 13px var(--display);letter-spacing:.04em}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .t{font-weight:700;overflow-wrap:anywhere;line-height:1.25}
.pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.pill.good{color:#0c2418;background:var(--good)} .pill.warn{color:#2a1c02;background:var(--warn)} .pill.bad{color:#2b0b0b;background:var(--bad)}
.pill.unv{color:var(--unv);background:transparent;box-shadow:inset 0 0 0 1px var(--unv)}
.pill.acc{color:#14100a;background:var(--tc,var(--accent))}
.val{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto}
.val b{display:block;font-size:15.5px} .val small{color:var(--muted)}
.val .pill{display:inline-block;margin-top:3px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.hit{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;color:inherit}
.hit .art{aspect-ratio:63/88;background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--tc) 40%,transparent),transparent 60%),linear-gradient(160deg,var(--panel2),#0d1118);position:relative;display:grid;place-items:center;font:800 20px var(--display);color:var(--tc)}
.hit .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hit .cap{padding:10px 11px 12px}
.hit .own{position:absolute;top:8px;right:8px;z-index:2}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:24px 18px;text-align:center;color:var(--muted);background:#131822e6}
.bars{display:grid;gap:5px;margin-top:8px}
.bar{display:grid;grid-template-columns:62px 1fr 78px;gap:8px;align-items:center;font-size:12.5px;font-variant-numeric:tabular-nums}
.bar i{display:block;height:11px;border-radius:999px;background:var(--muted);min-width:2px}
.bar.b10 i{background:var(--accent)}
.bar.est i{opacity:.6}
.bar.unvb i{background:repeating-linear-gradient(45deg,var(--unv) 0 4px,transparent 4px 8px);box-shadow:inset 0 0 0 1px var(--unv)}
.bar span:last-child{text-align:right}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
label.f,.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=search],select,textarea{background:#0d1118;border:1px solid var(--line);border-radius:11px;padding:10px 11px;width:100%;min-width:0;color:var(--text);font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:0}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:480px){.grid3{grid-template-columns:1fr 1fr}}
.seg{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#0d1118;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;font-weight:600;color:var(--muted);cursor:pointer;font-size:13px;border-radius:8px}
.seg button.on{background:var(--accent);color:#14100a}
.check{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
.check input{width:19px;height:19px;accent-color:var(--accent)}
#sheet{position:fixed;inset:0;z-index:20;display:none;background:#04060ad9;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
#sheet.open{display:flex}
#sheet .box{background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;width:min(680px,100%);max-height:93%;overflow:auto;padding:10px 16px calc(22px + env(safe-area-inset-bottom,0px))}
#sheet .box::before{content:"";display:block;width:42px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}
#sheet .box>.stack{gap:12px}
#sheet .inset{background:#0d1118;border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:10px}
.fab{position:fixed;right:max(16px,calc(50% - 524px));bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom,0px));z-index:7;width:56px;height:56px;border-radius:50%;padding:0;font:800 30px/1 var(--display);box-shadow:0 10px 28px #000b;display:grid;place-items:center}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 84px);transform:translateX(-50%);z-index:30;background:#f3f5f9;color:#11151c;font-weight:600;padding:10px 15px;border-radius:12px;display:none;max-width:90%;box-shadow:0 8px 30px #000a}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:11px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.step input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:0 0 auto}
.emblem{display:grid;place-items:center;aspect-ratio:16/10;position:relative;overflow:hidden}
.emblem b{font:800 30px/1 var(--display);color:#fff;letter-spacing:.02em;text-shadow:0 2px 14px #0008}
.emblem img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:14px;background:radial-gradient(circle at 50% 40%,#232c3c,#0d1118)}
.sethead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.sethead .emblem{width:170px;border-radius:14px;border:1px solid var(--line);flex:0 0 auto}
.sheetprev{position:relative;max-width:420px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.sheetprev img{display:block;width:100%}
.gridlines{position:absolute;inset:0;display:grid}
.gridlines span{border:1px dashed #fffc;display:grid;place-items:start;padding:3px 5px;font:700 12px var(--body);color:#fff;text-shadow:0 1px 3px #000}
.card.picked{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--panel))}
.tick{flex:0 0 22px;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick.on::after{content:"";width:10px;height:6px;border-left:2.5px solid #14100a;border-bottom:2.5px solid #14100a;transform:rotate(-45deg) translateY(-1px)}
.bulk{margin-bottom:12px;border-color:var(--accent)}
@media(min-width:900px){.bulk{position:sticky;top:64px;z-index:4;box-shadow:0 10px 30px #000a}}
table.mk td{padding:6px 0;border-bottom:1px solid var(--line)}
.preview.big{width:min(46%,220px)}
a.chip{text-decoration:none}
.preview{width:120px;aspect-ratio:63/88;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
progress{width:100%;accent-color:var(--accent);height:8px}
.note{border-left:3px solid var(--unv);padding:9px 12px;background:#1d1a2df2;border-radius:0 12px 12px 0;font-size:13.5px}
@media(min-width:900px){
  :root{--nav:0px}
  .app{padding-bottom:80px}
  header.top{padding-top:22px}
  nav.bottomnav{position:sticky;top:0;bottom:auto;height:auto;border:0;background:linear-gradient(180deg,var(--ink) 60%,transparent);backdrop-filter:none;justify-content:flex-start;padding:8px 0 14px;margin:0}
  nav.bottomnav .in{width:auto;gap:6px}
  nav.bottomnav a{flex:0 0 auto;flex-direction:row;gap:8px;font-size:14px;padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:#131822d9}
  nav.bottomnav a svg{width:18px;height:18px}
  nav.bottomnav a.on{background:var(--accent);border-color:var(--accent);color:#14100a}
  .subnav{max-width:520px}
  .fab{bottom:28px}
  #toast{bottom:100px}
}
@media (prefers-reduced-motion:no-preference){.card,.hit,.chip,.btn{transition:transform .12s,border-color .12s,background .12s}.card:active,.hit:active{transform:scale(.985)}.card:hover,.hit:hover{border-color:#3a4558}}

:root{--nav:0px}
.topbar{position:sticky;top:0;z-index:8;background:#0b0f16ec;border-bottom:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-top:env(safe-area-inset-top,0px)}
.tbin{max-width:1080px;margin:0 auto;padding:11px 16px 0;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:12px}
a.brand{text-decoration:none;color:inherit;min-width:0}
.tbin .brand h1{font-size:clamp(19px,5.4vw,23px)}
nav.mainnav{grid-column:1/-1;margin:7px -16px 0}
nav.mainnav .in{display:flex;padding:0 6px}
nav.mainnav a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 4px 10px;text-decoration:none;color:var(--muted);font-size:13.5px;font-weight:650;border-bottom:2px solid transparent;white-space:nowrap}
nav.mainnav a svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.mainnav a.on{color:var(--text);border-bottom-color:var(--accent)}
nav.mainnav a.on svg{color:var(--accent)}
.app{padding-top:16px}
@media(max-width:400px){nav.mainnav a svg{display:none}}
@media(min-width:900px){
  .tbin{grid-template-columns:auto 1fr auto;padding:0 16px;column-gap:30px}
  .tbin .sync{order:3}
  nav.mainnav{grid-column:auto;margin:0;order:2}
  nav.mainnav .in{padding:0;gap:2px}
  nav.mainnav a{flex:0 0 auto;padding:21px 15px 19px;font-size:14.5px}
  nav.mainnav a:hover{color:var(--text)}
}
#sheetBox:focus{outline:none}
</style>
</head>
<body>
<div id="backdrop"><canvas id="foil"></canvas><div id="chase"></div></div>
<div class="topbar"><div class="tbin">
  <a class="brand" href="#collection"><h1>Howard <span>Card Vault</span></h1><p id="tagline" hidden>Rips, hits and values for the family binders.</p></a>
  <div class="sync"><i class="dot" id="syncDot"></i><span id="syncText">Starting up</span></div>
  <nav class="mainnav" id="tabs" aria-label="Sections"></nav>
</div></div>
<div class="app">
  <main id="view"></main>
</div>
<button class="btn pri fab" id="fab" data-act="new-card" aria-label="Add a card">+</button>
<div id="sheet"><div class="box" id="sheetBox" role="dialog" aria-modal="true" aria-label="Details" tabindex="-1"></div></div>
<div id="toast" role="status"></div>
<script src="data/reference.js"></script>
<script src="data/rarecandy.js"></script>
<script>
"use strict";
const REF = window.TCG_REF || {tcgs:[{id:"other",label:"Other",accent:"#8fd3c8"}],rarities:{},sets:{},serialSteps:[],otherSerialNotes:[],gradingNotes:[],hot:{hitRates:[],market:[],radar:[]},setList:{}};
const VIEWS = [["collection","Collection"],["rips","Rip log"],["hits","Hits"],["value","Raw vs BGS 10"],["find","Search + Scan"],["hot","What's hot"],["sets","Sets"],["serials","Serial check"]];
const REASONS = ["Artwork","Nostalgia","Favorite character","Set building","Value hold","Kid's pick"];
const S = {mode:"starting", cards:new Map(), products:new Map(), watch:new Map(), settings:{owners:["Alexander"],gradeFee:null},
  view:"collection", f:{tcg:"all",owner:"all",decision:"all",q:""}, findTab:"search", search:{q:"",tcg:"pokemon",results:null,busy:false,note:""},
  scan:{busy:false,msg:""}, selMode:false, sel:new Set(), bulkMsg:"", sheet:null, liveSets:{}, setTcg:"pokemon", setOpen:null, setMore:60, imp:{rows:null,busy:false,done:0,total:0,msg:""}, serialCard:"", serialTicks:{}, net:"unknown", stale:false, readOnly:false};
let db=null, assets=null, sample=null, downloads=null, sampleImages=false;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const money = n => (n==null||n===""||isNaN(n)) ? "" : "$" + Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const num = v => { if(v===""||v==null) return null; const n = parseFloat(String(v).replace(/[$,]/g,"")); return isNaN(n)?null:n; };
const tcgOf = id => REF.tcgs.find(t=>t.id===id) || REF.tcgs[REF.tcgs.length-1];
const cards = () => [...S.cards.values()];
const products = () => [...S.products.values()].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
function toast(m){ const t=$("#toast"); t.textContent=m; t.style.display="block"; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display="none",2600); }
const SHORT={naruto:"NK",pokemon:"PK",yugioh:"YG",kpdh:"KP",onepiece:"OP",other:"TC"};
const HOSTED="https://alexanderhoward141623-byte.github.io/Howard-Card-Vault/";
function imgSrc(c,small){ if(c.photoId&&S.mode==="cloud") return "/_blob/"+c.photoId; let u=c.photo||c.imageUrl||""; if(small&&u) u=u.replace(/(images\.scrydex\.com\/.+)\/large$/,"$1/small").replace(/\/high\.webp$/,"/low.webp"); return u; }
function thumb(c){ const s=imgSrc(c,true); return `<span class="thumb">${SHORT[c.tcg]||"TC"}${s?`<img src="${esc(s)}" alt="" loading="lazy" onerror="this.remove()">`:""}</span>`; }
function valStatusPill(st){ return st==="verified" ? "" : st==="estimate" ? `<span class="pill">estimate</span>` : `<span class="pill unv">unverified</span>`; }
function serialRule(c){
  if(c.tcg==="pokemon"||c.tcg==="yugioh"||c.tcg==="onepiece") return {mode:"never"};
  if(c.tcg==="naruto"){ const st=normSet(c.set), e=st&&(REF.setList.naruto||[]).find(x=>x.ladder&&(normSet(x.name)===st||st.includes(normSet(x.name)))), lad=e&&REF.sets[e.ladder]; if(lad){ const r=(c.rarity||"").replace(/\s*\(.*$/,"").trim().toUpperCase(); if(/^PR/.test(r)) return {mode:"never"}; const tier=lad.ladder.find(x=>x.code.toUpperCase()===r); if(tier) return tier.run?{mode:"always",run:tier.run}:{mode:"never"}; } }

  x.clearRect(0,0,w,h); let seed=a.charCodeAt(1)*7+a.charCodeAt(3); const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };

  for(let i=0;i<46;i++){ const bw=10+rnd()*70; x.globalAlpha=.05+rnd()*.14; x.fillStyle = i%5===0 ? "#ffffff" : i%3===0 ? "#6fd3ff" : a; x.fillRect(rnd()*w*2,0,bw,h*3); }

/* ---------- photos ---------- */
function shrink(file,max,q){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file), im=new Image(); im.onload=()=>{ const s=Math.min(1,max/Math.max(im.width,im.height)), c=document.createElement("canvas"); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext("2d").drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",q); }; im.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error("That file is not a photo this browser can open.")); }; im.src=u; }); }
function blobToDataURL(b){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(b); }); }
async function handleScan(file){

  let guess={}, note="";
  if(sample&&sampleImages){
    S.scan.msg="Claude is reading the card. This can take up to a minute."; render();
    const prompt=`This photo shows one trading card for a family collection tracker. Read only what is visible and reply with only a JSON object:
{"tcg": one of ${JSON.stringify(REF.tcgs.map(t=>t.id))}, "name": string, "character": string, "set": string, "number": string, "rarity": string, "serialVisible": "yes" | "no" | "unclear", "serialNo": string, "serialRun": string, "confidence": "high" | "medium" | "low", "notes": string}
Rules: use "" for anything you cannot read. Never guess a serial number, a print run, or a price. "kpdh" means Kayou KPop Demon Hunters cards. Kayou Naruto card codes look like NRSA03-SE-001 where the middle part is the rarity; put the full code in "number". A serial stamp looks like a small fraction such as 042/220 printed on the card face. "notes" is one short sentence on anything you were unsure about.`;
    try{ const r=await sample.json(prompt,{images:[blob],cache:false}); if(r&&typeof r==="object") guess=r; note = guess.confidence==="high" ? "Claude read this card with high confidence. Check it against the card before saving." : "Claude was not fully sure about this one. Check every field against the card."; if(guess.notes) note+=" "+String(guess.notes); }
    catch(e){ const c=e&&e.code; note = c==="not_granted"||c==="sampling_disabled" ? "Card reading is switched off for this visit, so fill in the details by hand." : c==="rate_limited" ? "Claude is busy right now. The photo is attached, fill in the details by hand or try again in a bit." : "Claude could not read that photo. The photo is attached, fill in the details by hand."; }
  } else note="Photo attached. Fill in the details from the card.";
  S.scan={busy:false,msg:""}; pendingPhoto=blob;
  const str=v=>typeof v==="string"?v.trim():"";
  const c={tcg:REF.tcgs.some(t=>t.id===guess.tcg)?guess.tcg:(S.f.tcg!=="all"?S.f.tcg:"naruto"),name:str(guess.name),character:str(guess.character),set:str(guess.set),number:str(guess.number),rarity:str(guess.rarity),
    serial: guess.serialVisible==="yes"&&str(guess.serialNo) ? "yes" : guess.serialVisible==="no" ? "no" : "unverified", serialNo:str(guess.serialNo), serialRun:str(guess.serialRun), source:"scan", isHit:true, notes:""};
  cardSheet(c,true); pendingPhoto=blob; drawCardSheet(); if(note) toast(note);
  const n=document.createElement("div"); n.className="note"; n.textContent=note; $("#cardForm").insertBefore(n,$("#cardForm").children[1]);

/* ---------- import / export ---------- */
function parseCSV(text){
  const delim = text.split("\n")[0].includes("\t") ? "\t" : ","; const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i]; if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; } else if(ch==='"') q=true; else if(ch===delim){ row.push(cur); cur=""; } else if(ch==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; } else if(ch!=="\r") cur+=ch; }
  if(cur||row.length){ row.push(cur); rows.push(row); } return rows.filter(r=>r.some(c=>c.trim()));
}
function mapRows(rows){
  if(rows.length<2) return []; const hd=rows[0].map(h=>h.trim().toLowerCase());
  const col=(...keys)=>{ for(const k of keys){ const i=hd.findIndex(h=>h===k); if(i>=0) return i; } for(const k of keys){ const i=hd.findIndex(h=>h.includes(k)); if(i>=0) return i; } return -1; };
  const ix={name:col("name","card name","card","product name","title"),set:col("set","set name","expansion","series"),number:col("number","card number","no.","collector number","#"),qty:col("quantity","qty","count","owned"),cond:col("condition","grade"),rar:col("rarity"),price:col("market price","price","value","market","unit price")};
  if(ix.name<0) return [];
  return rows.slice(1).map(r=>({name:(r[ix.name]||"").trim(),set:ix.set>=0?(r[ix.set]||"").trim():"",number:ix.number>=0?(r[ix.number]||"").trim():"",qty:Math.max(1,Math.round(num(ix.qty>=0?r[ix.qty]:1)||1)),condition:ix.cond>=0?(r[ix.cond]||"").trim():"",rarity:ix.rar>=0?(r[ix.rar]||"").trim():"",raw:ix.price>=0?num(r[ix.price]):null})).filter(r=>r.name);
}

  else if(a==="bulk"){ const k=b.dataset.k, on=b.dataset.v==="1"; bulkApply({[k]:on}, k==="isHit"?(on?"Added to hits":"Removed from hits"):(on?"Marked top loaded":"Marked not top loaded")); }
  else if(a==="mkt-refresh") marketRefresh();
  else if(a==="mkt-apply"){ const d=draft, m=d&&d.market; if(d&&d.kind==="card"&&m&&m.raw!=null){ readCardForm(); const c=d.obj; c.raw=m.raw; c.rawStatus="estimate"; c.rawSource="market"; c.rawNote=[m.source,m.asOf].filter(Boolean).join(", "); if(m.catalogId) c.catalogId=m.catalogId; drawCardSheet(); } }
  else if(a==="view-add"){ const d=draft; if(d&&d.kind==="view"){ const m=d.market; closeSheetQuiet(); addCatalogCard(d.tcg,d.setName,d.cc,m); } }
  else if(a==="edit-card"){ const c=S.cards.get(id); if(c) cardSheet({...c,reasons:[...(c.reasons||[])]},false); }
  else if(a==="close") closeSheet();
  else if(a==="seg"){ if(draft&&draft.kind==="card"){ readCardForm(); draft.obj[b.dataset.name]=v; drawCardSheet(); } }
  else if(a==="reason"){ readCardForm(); const r=draft.obj.reasons, i=r.indexOf(v); if(i>=0) r.splice(i,1); else r.push(v); drawCardSheet(); }
  else if(a==="del-card") armDelete(b,async()=>{ const c=draft.obj; await del("cards",c.id); toast("Deleted."); closeSheet(); });
  else if(a==="new-product") productSheet({tcg:S.f.tcg!=="all"?S.f.tcg:"naruto"},true);
  else if(a==="edit-product"){ const p=S.products.get(id); if(p) productSheet({...p},false); }
  else if(a==="del-product") armDelete(b,async()=>{ await del("products",draft.obj.id); toast("Deleted. Its pulls stay in your collection."); closeSheet(); });
  else if(a==="pack-plus"){ const p=S.products.get(id); if(p){ const n=Math.min((p.packsOpened||0)+1,p.packs||99); put("products",{...p,packsOpened:n,state:"opened"}).catch(()=>{}); } }
  else if(a==="pull"){ const p=S.products.get(id); if(p) cardSheet({tcg:p.tcg,set:p.set,productId:p.id,pack:Math.max(1,p.packsOpened||1),source:"pull"},true); }
  else if(a==="seed-naruto") seedNaruto();
  else if(a==="find-tab"){ S.findTab=v; render(); }
  else if(a==="rc-load") rcLoad();
  else if(a==="sheet-read") sheetRead();
  else if(a==="sheet-add") sheetAdd();
  else if(a==="sheet-clear"){ S.sheet=null; render(); }
  else if(a==="set-tcg"){ S.setTcg=v; S.setOpen=null; render(); }
  else if(a==="open-set"){ const x=[...setList(S.setTcg)].find(z=>z.name===v)||{name:v}; S.setOpen={tcg:S.setTcg,...x}; S.setMore=60; render(); window.scrollTo(0,0); loadSetCards(); }
  else if(a==="set-back"){ S.setOpen=null; render(); }
  else if(a==="set-more"){ S.setMore=(S.setMore||60)+60; render(); }
  else if(a==="add-setcard"){ const o=S.setOpen, d=o&&setData(o), cc=d&&d.cards&&d.cards[+b.dataset.i]; if(cc) viewSheet(o.tcg,o.name,cc); }
  else if(a==="do-search") doSearch();
  else if(a==="add-result"&&S.search.results[+b.dataset.i]&&S.search.results[+b.dataset.i].tdId){ const r=S.search.results[+b.dataset.i]; viewSheet("pokemon",r.set,{id:r.tdId,name:r.name,number:r.number,big:r.imageUrl,img:r.img}); }
  else if(a==="add-result"){ const r=S.search.results[+b.dataset.i]; if(r) cardSheet({tcg:r.tcg,name:r.name,set:r.set,number:r.number,rarity:r.rarity,imageUrl:r.imageUrl||"",raw:r.raw,rawStatus:r.raw!=null?"estimate":"unverified",serial:r.tcg==="naruto"||r.tcg==="kpdh"?"unverified":"no",source:"search"},true); }
  else if(a==="imp-preview") impPreview();
  else if(a==="imp-go") impGo();
  else if(a==="export-json") exportFile("json");
  else if(a==="export-csv") exportFile("csv");
  else if(a==="new-watch") watchSheet({},true);
  else if(a==="edit-watch"){ const w=S.watch.get(id); if(w) watchSheet(w,false); }
  else if(a==="del-watch") armDelete(b,async()=>{ await del("watch",draft.obj.id); closeSheet(); });
  else if(a==="serial-yes"||a==="serial-no"||a==="serial-unv"){ const c=S.cards.get(S.serialCard); if(!c) return; if(a==="serial-yes"){ cardSheet({...c,serial:"yes",reasons:[...(c.reasons||[])]},false); toast("Enter your copy number and the run, then save."); } else { await put("cards",{...c,serial:a==="serial-no"?"no":"unverified",serialNo:"",serialRun:""}).catch(()=>{}); toast(a==="serial-no"?"Marked not numbered.":"Left as unverified."); S.serialTicks={}; render(); } }
});
document.addEventListener("submit", e=>{ e.preventDefault(); const id=e.target.id;
  if(id==="cardForm") saveCard(); else if(id==="productForm") saveProduct();
  else if(id==="watchForm"){ const g=i=>document.getElementById(i).value.trim(), o={...draft.obj,name:g("wName"),price:num(g("wPrice")),target:num(g("wTarget")),msrp:num(g("wMsrp")),where:g("wWhere"),seen:g("wSeen")}; if(!o.name){ toast("Name the product first."); return; } if(!o.id){ o.id=uid("w_"); o.createdAt=Date.now(); } put("watch",o).then(closeSheet).catch(()=>{}); }
  else if(id==="ownerForm"){ const n=$("#oName").value.trim(); if(!n) return; if(!S.settings.owners.includes(n)) S.settings.owners=[...S.settings.owners,n]; saveSettings().then(()=>{ toast(n+" added."); closeSheet(); }); }
});
document.addEventListener("change", e=>{ const t=e.target;
  if(t.id==="fDecision"){ S.f.decision=t.value; render(); }
  else if(t.id==="gradeFee"){ S.settings.gradeFee=num(t.value); saveSettings(); if(S.mode==="cloud") render(); }
  else if(t.id==="camIn"||t.id==="libIn") handleScan(t.files[0]);
  else if(t.id==="sheetIn") sheetPick(t.files[0]);
  else if(t.id==="bakFile") restoreBackup(t.files[0]);
  else if(t.id==="sheetLay"){ const [c,r]=t.value.split("x").map(Number); Object.assign(S.sheet,{lay:t.value,cols:c,rows:r,cells:null}); render(); }
  else if(t.id==="sheetTcg"){ S.sheet.tcg=t.value; }
  else if(t.id==="sheetOwner"){ S.sheet.owner=t.value; }
  else if(t.dataset.act==="cell-on"){ document.querySelectorAll("[data-cell]").forEach(el=>{ S.sheet.cells[+el.dataset.cell].name=el.value.trim(); }); S.sheet.cells[+t.dataset.i].on=t.checked; render(); }
  else if(t.id==="cPhoto"){ const f=t.files[0]; if(f) shrink(f,1400,.85).then(b=>{ readCardForm(); pendingPhoto=b; drawCardSheet(); }).catch(()=>toast("That photo could not be read.")); }
  else if(t.id==="cTcg"||t.id==="cRarity"||t.id==="cSet"||t.id==="cNumber"){ readCardForm(); draft.market=null; drawCardSheet(); }
  else if(t.id==="bulkDecision"&&t.value){ bulkApply({decision:t.value},"Decision set to "+t.value); }
  else if(t.id==="bulkProduct"&&t.value){ bulkApply({productId:t.value==="-"?"":t.value},"Pulled from updated"); }
  else if(t.id==="bulkOwner"&&t.value){ bulkApply({owner:t.value},"Collector set to "+t.value); }
  else if(t.id==="serialCard"){ S.serialCard=t.value; S.serialTicks={}; render(); }
  else if(t.dataset.act==="tick"){ S.serialTicks[t.dataset.i]=t.checked; render(); }
  else if(t.id==="stcg"){ S.search.tcg=t.value; S.search.results=null; S.search.note=""; S.search.q=$("#sq").value; render(); }
});
let qt; document.addEventListener("input", e=>{ if(e.target.id==="q"){ S.f.q=e.target.value; clearTimeout(qt); qt=setTimeout(()=>{ S.more=60; render(); const el=$("#q"); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } },250); } });
document.addEventListener("keydown", e=>{ if(e.key==="Enter"&&e.target.id==="sq"){ e.preventDefault(); doSearch(); } if(e.key==="Escape"&&sheetOpen()) closeSheet();
  if(e.key==="Tab"&&sheetOpen()){ const box=$("#sheetBox"), f=[...box.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null); if(!f.length){ e.preventDefault(); return; } const a=document.activeElement, first=f[0], last=f[f.length-1]; if(!box.contains(a)||(e.shiftKey&&(a===first||a===box))){ e.preventDefault(); last.focus(); } else if(!e.shiftKey&&a===last){ e.preventDefault(); first.focus(); } } });
let rz; addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(drawFoil,150); });

async function seedNaruto(){
  const base={tcg:"naruto",set:"Chapter Jin Series 3",packs:5,cardsPerPack:8,price:null,retailer:"",packsOpened:0}, t=Date.now();
  const list=[{...base,id:"p_jin3_box1",name:"Chapter Jin Series 3 Collector Box #1",state:"opened",ship:"unknown",resolution:"none",packsOpened:5,createdAt:t,notes:"Opened. Add the price, how it arrived, and log the pulls."},
    {...base,id:"p_jin3_box2",name:"Chapter Jin Series 3 Collector Box #2",state:"opened",ship:"unknown",resolution:"none",packsOpened:5,createdAt:t+1,notes:"Opened. Add the price, how it arrived, and log the pulls."},
    {...base,id:"p_jin3_replacement",name:"Chapter Jin Series 3 Collector Box (replacement)",state:"incoming",ship:"not-arrived",resolution:"replacement-shipped",createdAt:t+2,notes:"Replacement still on the way. Mark it arrived, then log each pack as you open it."}];
  for(const p of list){ try{ await put("products",p); }catch(e){ return; } } toast("Three boxes added.");
}
boot();
</script>
</body>
