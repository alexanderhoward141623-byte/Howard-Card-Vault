<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Howard Card Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a binder on a dark desk. One sticky tab strip, stacked sleeves of content, foil backdrop tinted by the TCG in focus. */
:root{
  color-scheme:dark;
  --ink:#0e1117; --panel:#171c26; --panel2:#1f2633; --line:#2d3546;
  --text:#eef1f6; --muted:#9aa5b8;
  --accent:#f28c28;
  --good:#4cc38a; --warn:#f2b84b; --bad:#ef6a6a; --unv:#b9a2f2;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ink);color:var(--text);font:400 15px/1.45 var(--body);-webkit-text-size-adjust:100%}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#backdrop{position:fixed;inset:0;z-index:0;pointer-events:none}
#foil{width:100%;height:100%;display:block;opacity:.55}
#collage{position:absolute;inset:0;overflow:hidden}
#collage img{position:absolute;width:120px;aspect-ratio:5/7;object-fit:cover;border-radius:8px;opacity:.28;filter:saturate(1.1) blur(.4px);box-shadow:0 10px 30px #0009}
#backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0e111766 0,#0e1117e6 380px,var(--ink) 720px)}
.app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:0 16px 110px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:22px 0 10px;flex-wrap:wrap}
.brand h1{font:800 30px/1 var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance}
.brand h1 span{color:var(--accent)}
.brand p{margin:6px 0 0;color:var(--muted);font-size:13px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.dot.ok{background:var(--good)} .dot.off{background:var(--muted)}
nav.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px 0;background:linear-gradient(180deg,var(--ink) 70%,transparent);scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);font-weight:600;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:#171c26cc}
nav.tabs a.on{color:#14100a;background:var(--accent);border-color:var(--accent)}
h2{font:800 21px/1.15 var(--display);margin:22px 0 10px;text-wrap:balance}
h3{font:600 15px/1.2 var(--body);margin:0}
.muted{color:var(--muted)} .small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:6px 11px;font-weight:600;font-size:13px;cursor:pointer}
.chip.on{color:var(--text);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 13px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#14100a}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.tile b{display:block;font:800 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--tc,var(--line));border-radius:var(--r);padding:10px;cursor:pointer;text-align:left;width:100%}
.thumb{flex:0 0 54px;width:54px;aspect-ratio:5/7;border-radius:6px;background:linear-gradient(135deg,var(--panel2),#111620);position:relative;overflow:hidden;display:grid;place-items:center;color:var(--tc,var(--muted));font:800 13px var(--display)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .t{font-weight:700;overflow-wrap:anywhere}
.pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.pill{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.pill.good{color:#0c2418;background:var(--good)} .pill.warn{color:#2a1c02;background:var(--warn)} .pill.bad{color:#2b0b0b;background:var(--bad)}
.pill.unv{color:var(--unv);background:transparent;border:1px dashed var(--unv)}
.pill.acc{color:#14100a;background:var(--tc,var(--accent))}
.val{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.val b{display:block} .val small{color:var(--muted)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.hit{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;color:inherit}
.hit .art{aspect-ratio:5/7;background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--tc) 45%,transparent),transparent 60%),linear-gradient(160deg,var(--panel2),#0f131b);position:relative;display:grid;place-items:center;font:800 26px var(--display);color:var(--tc)}
.hit .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hit .cap{padding:9px 10px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted)}
.bars{display:grid;gap:5px;margin-top:8px}
.bar{display:grid;grid-template-columns:62px 1fr 78px;gap:8px;align-items:center;font-size:12.5px;font-variant-numeric:tabular-nums}
.bar i{display:block;height:12px;border-radius:4px;background:var(--muted);min-width:2px}
.bar.b10 i{background:var(--accent)}
.bar.est i{opacity:.6}
.bar.unvb i{background:repeating-linear-gradient(45deg,var(--unv) 0 4px,transparent 4px 8px);border:1px dashed var(--unv)}
.bar span:last-child{text-align:right}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:12px;font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=search],select,textarea{background:#10141c;border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0;color:var(--text)}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:480px){.grid3{grid-template-columns:1fr 1fr}}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:#10141c;padding:9px 6px;font-weight:600;color:var(--muted);cursor:pointer;font-size:13px}
.seg button.on{background:var(--accent);color:#14100a}
.check{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
#sheet{position:fixed;inset:0;z-index:20;display:none;background:#05070bcc;align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
#sheet .box{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:min(680px,100%);max-height:92%;overflow:auto;padding:16px 16px 26px}
#sheet .box>.stack{gap:12px}
.fab{position:fixed;right:18px;bottom:22px;z-index:6;border-radius:999px;padding:14px 20px;font-weight:800;box-shadow:0 10px 30px #000a}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:30;background:#f3f5f9;color:#11151c;font-weight:600;padding:9px 14px;border-radius:10px;display:none;max-width:90%}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px}
.step input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:0 0 auto}
.emblem{display:grid;place-items:center;aspect-ratio:16/10;position:relative;overflow:hidden}
.emblem b{font:800 34px/1 var(--display);color:#fff;letter-spacing:.02em;text-shadow:0 2px 14px #0008}
.emblem img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:12px;background:#0e1117d9}
.sheetprev{position:relative;max-width:420px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.sheetprev img{display:block;width:100%}
.gridlines{position:absolute;inset:0;display:grid}
.gridlines span{border:1px dashed #fffc;display:grid;place-items:start;padding:3px 5px;font:700 12px var(--body);color:#fff;text-shadow:0 1px 3px #000}
.preview{width:120px;aspect-ratio:5/7;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
progress{width:100%;accent-color:var(--accent)}
.note{border-left:3px solid var(--unv);padding:8px 12px;background:#b9a2f214;border-radius:0 10px 10px 0;font-size:13.5px}
@media (prefers-reduced-motion:no-preference){.card,.hit,.chip,.btn{transition:transform .12s,border-color .12s}.card:active,.hit:active{transform:scale(.99)}}
</style>
</head>
<body>
<div id="backdrop"><canvas id="foil"></canvas><div id="collage"></div></div>
<div class="app">
  <header class="top">
    <div class="brand"><h1>Howard <span>Card Vault</span></h1><p id="tagline">Rips, hits and values for the whole family's binders.</p></div>
    <div class="sync"><i class="dot" id="syncDot"></i><span id="syncText">Starting up</span></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>
<button class="btn pri fab" id="fab" data-act="new-card">+ Add card</button>
<div id="sheet"><div class="box" id="sheetBox"></div></div>
<div id="toast" role="status"></div>
<script src="data/reference.js"></script>
<script src="data/rarecandy.js"></script>
<script>
"use strict";
const REF = window.TCG_REF || {tcgs:[{id:"other",label:"Other",accent:"#8fd3c8"}],rarities:{},sets:{},serialSteps:[],otherSerialNotes:[],gradingNotes:[],hot:{hitRates:[],market:[],radar:[]},setList:{}};
const VIEWS = [["collection","Collection"],["rips","Rip log"],["hits","Hits"],["value","Raw vs BGS 10"],["find","Search + Scan"],["hot","What's hot"],["sets","Sets"],["serials","Serial check"]];
const REASONS = ["Artwork","Nostalgia","Favorite character","Set building","Value hold","Kid's pick"];
const S = {mode:"starting", cards:new Map(), products:new Map(), watch:new Map(), settings:{owners:["Alexander"],gradeFee:null},
  view:"collection", f:{tcg:"all",owner:"all",decision:"all",q:""}, findTab:"search", search:{q:"",tcg:"pokemon",results:null,busy:false,note:""},
  scan:{busy:false,msg:""}, sheet:null, liveSets:{}, setTcg:"naruto", imp:{rows:null,busy:false,done:0,total:0,msg:""}, serialCard:"", serialTicks:{}, net:"unknown", stale:false, readOnly:false};
let db=null, assets=null, sample=null, downloads=null, sampleImages=false;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const money = n => (n==null||n===""||isNaN(n)) ? "" : "$" + Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const num = v => { if(v===""||v==null) return null; const n = parseFloat(String(v).replace(/[$,]/g,"")); return isNaN(n)?null:n; };
const tcgOf = id => REF.tcgs.find(t=>t.id===id) || REF.tcgs[REF.tcgs.length-1];
const cards = () => [...S.cards.values()];
const products = () => [...S.products.values()].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
function toast(m){ const t=$("#toast"); t.textContent=m; t.style.display="block"; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display="none",2600); }
function imgSrc(c){ return c.photoId ? "/_blob/"+c.photoId : (c.photo || c.imageUrl || ""); }
function thumb(c){ const s=imgSrc(c); const ini=esc((c.rarity||tcgOf(c.tcg).label).slice(0,4)); return `<span class="thumb">${ini}${s?`<img src="${esc(s)}" alt="" loading="lazy" onerror="this.remove()">`:""}</span>`; }
function valStatusPill(st){ return st==="verified" ? "" : st==="estimate" ? `<span class="pill">estimate</span>` : `<span class="pill unv">unverified</span>`; }
function serialPill(c){ if(c.serial==="yes") return `<span class="pill acc">#${esc(c.serialNo||"?")}/${esc(c.serialRun||"?")}</span>`; if(c.serial==="unverified") return `<span class="pill unv">serial unverified</span>`; return ""; }
function decisionPill(c){ const d=c.decision||"undecided"; if(d==="undecided") return `<span class="pill">undecided</span>`; const why=(d==="keep"&&c.reasons&&c.reasons.length)?" · "+esc(c.reasons.join(", ")):""; return `<span class="pill ${d==="keep"?"good":d==="sell"?"warn":""}">${d}${why}</span>`; }

/* ---------- storage: Claude db when hosted as an artifact, this browser otherwise ---------- */
const LS="cardvault.v1";
function saveLocal(){ if(S.mode!=="local") return; try{ localStorage.setItem(LS, JSON.stringify({cards:cards(),products:products(),watch:[...S.watch.values()],settings:S.settings})); }catch(e){ toast("This browser is out of storage space. Export a backup."); } }
function loadLocal(){ try{ const d=JSON.parse(localStorage.getItem(LS)||"null"); if(d){ (d.cards||[]).forEach(c=>S.cards.set(c.id,c)); (d.products||[]).forEach(p=>S.products.set(p.id,p)); (d.watch||[]).forEach(w=>S.watch.set(w.id,w)); if(d.settings) S.settings={...S.settings,...d.settings}; } }catch(e){} }
const mapOf = {cards:()=>S.cards, products:()=>S.products, watch:()=>S.watch};
async function put(coll, obj){
  const {id, ...data} = obj; data.updatedAt = Date.now();
  Object.keys(data).forEach(k=>{ if(data[k]===undefined) delete data[k]; });
  if(S.mode==="cloud"){ try{ await db.doc(coll+"/"+id).set(data); }catch(e){ writeFail(e); throw e; } }
  else { mapOf[coll]().set(id,{id,...data}); saveLocal(); render(); }
}
async function del(coll, id){
  if(S.mode==="cloud"){ try{ await db.doc(coll+"/"+id).delete(); }catch(e){ writeFail(e); } }
  else { mapOf[coll]().delete(id); saveLocal(); render(); }
}
async function saveSettings(){ if(S.mode==="cloud"){ try{ await db.doc("meta/settings").set({...S.settings}); }catch(e){ writeFail(e); } } else { saveLocal(); render(); } }
function writeFail(e){ const c=e&&e.code; if(c==="invalid_argument"){ S.readOnly=true; toast("You can view this vault but not change it."); } else if(c==="quota_exceeded") toast("The vault is full. Remove some cards first."); else if(c==="resource_exhausted") toast("Saving too fast. Wait a moment and try again."); else toast("Could not save. Check your connection and try again."); }
function setSync(){ const d=$("#syncDot"), t=$("#syncText"); if(S.mode==="cloud"){ d.className="dot "+(S.stale?"":"ok"); t.textContent=S.stale?"Saved copy, reconnecting":"Synced across your devices"; } else if(S.mode==="local"){ d.className="dot off"; t.textContent="Saved on this device only"; } else { d.className="dot"; t.textContent="Starting up"; } }

async function boot(){
  window.addEventListener("hashchange", route); route();
  drawFoil(); render();
  let cl = window.claude && typeof window.claude.use==="function" ? window.claude : null;
  if(cl){ try{ db = await cl.use("db"); }catch(e){ db=null; } }
  if(db){
    S.mode="cloud"; S.stale=true; setSync();
    const timer=setTimeout(()=>{ S.stale=true; setSync(); },10000);
    const sub=(coll,map)=>db.collection(coll).limit(1000).onSnapshot(snap=>{ map.clear(); snap.docs.forEach(d=>map.set(d.id,{id:d.id,...d.data()})); if(!snap.metadata.fromCache){ clearTimeout(timer); S.stale=false; } setSync(); if(!sheetOpen()) render(); else S.dirty=true; }, ()=>{ clearTimeout(timer); S.stale=true; setSync(); });
    sub("cards",S.cards); sub("products",S.products); sub("watch",S.watch);
    db.doc("meta/settings").onSnapshot(s=>{ if(s.exists){ S.settings={...S.settings,...s.data()}; if(!sheetOpen()) render(); } }, ()=>{});
    cl.use("assets").then(a=>{assets=a;}).catch(()=>{});
    cl.use("downloads").then(a=>{downloads=a; render();}).catch(()=>{});
    cl.use("sample").then(async s=>{ sample=s; if(s){ try{ const l=await s.limits(); sampleImages=!!(l&&l.images); }catch(e){} } render(); }).catch(()=>{});
  } else { S.mode="local"; loadLocal(); setSync(); render(); }
}
function route(){ const h=(location.hash||"").replace("#",""); S.view = VIEWS.some(v=>v[0]===h) ? h : "collection"; if(S.mode!=="starting") render(); window.scrollTo(0,0); }

/* ---------- backdrop ---------- */
function accent(){ return S.f.tcg!=="all" ? tcgOf(S.f.tcg).accent : (S.view==="find" ? tcgOf(S.search.tcg).accent : S.view==="sets" ? tcgOf(S.setTcg).accent : "#f28c28"); }
function drawFoil(){
  const c=$("#foil"), w=c.width=innerWidth, h=c.height=Math.min(innerHeight,900), x=c.getContext("2d"), a=accent();
  x.clearRect(0,0,w,h); let seed=a.charCodeAt(1)*7+a.charCodeAt(3); const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  x.save(); x.translate(w/2,h/2); x.rotate(-0.5); x.translate(-w,-h);
  for(let i=0;i<46;i++){ const bw=10+rnd()*70; x.globalAlpha=.05+rnd()*.14; x.fillStyle = i%5===0 ? "#ffffff" : i%3===0 ? "#6fd3ff" : a; x.fillRect(rnd()*w*2,0,bw,h*3); }
  x.restore(); x.globalAlpha=.5; x.strokeStyle=a; x.lineWidth=1.5;
  for(let i=0;i<7;i++){ const cw=90+rnd()*60, ch=cw*1.4, px=rnd()*w, py=rnd()*h*.6; x.save(); x.translate(px,py); x.rotate((rnd()-.5)*.9); x.globalAlpha=.12+rnd()*.14; x.beginPath(); if(x.roundRect) x.roundRect(-cw/2,-ch/2,cw,ch,10); else x.rect(-cw/2,-ch/2,cw,ch); x.stroke(); x.restore(); }
}
function setCollage(urls){
  const el=$("#collage"); const u=[...new Set(urls.filter(Boolean))].slice(0,9); const key=u.join("|"); if(el.dataset.k===key) return; el.dataset.k=key;
  el.innerHTML=u.map((s,i)=>`<img src="${esc(s)}" alt="" onerror="this.remove()" style="left:${(i*11.5+2)%96}%;top:${[12,150,40,210,90,20,180,60,130][i]}px;transform:rotate(${[-9,6,-4,11,-13,8,-6,12,-3][i]}deg)">`).join("");
}

/* ---------- render ---------- */
function sheetOpen(){ return $("#sheet").classList.contains("open"); }
function render(){
  document.documentElement.style.setProperty("--accent", accent());
  $("#tabs").innerHTML = VIEWS.map(([id,l])=>`<a href="#${id}" class="${S.view===id?"on":""}">${l}</a>`).join("");
  const v = {collection:vCollection, rips:vRips, hits:vHits, value:vValue, find:vFind, hot:vHot, sets:vSets, serials:vSerials}[S.view];
  $("#view").innerHTML = v();
  $("#fab").style.display = S.readOnly ? "none" : "";
  drawFoil(); setSync();
  const pool = S.view==="find" && S.search.results ? S.search.results.map(r=>r.imageUrl) : filtered().map(imgSrc);
  setCollage(pool);
}
function filtered(){
  const q=S.f.q.trim().toLowerCase();
  return cards().filter(c=> (S.f.tcg==="all"||c.tcg===S.f.tcg) && (S.f.owner==="all"||c.owner===S.f.owner) && (S.f.decision==="all"||(c.decision||"undecided")===S.f.decision) && (!q || [c.name,c.character,c.set,c.number,c.rarity,c.notes].join(" ").toLowerCase().includes(q)))
    .sort((a,b)=>(b.raw||0)-(a.raw||0) || (b.createdAt||0)-(a.createdAt||0));
}
function filterBar(){
  const used = new Set(cards().map(c=>c.tcg));
  const t = [["all","All games"], ...REF.tcgs.filter(t=>used.has(t.id)||["naruto","pokemon","yugioh","kpdh"].includes(t.id)).map(t=>[t.id,t.label])];
  const o = [["all","Everyone"], ...S.settings.owners.map(n=>[n,n])];
  return `<div class="stack" style="gap:8px">
    <div class="chips">${t.map(([id,l])=>`<button class="chip ${S.f.tcg===id?"on":""}" data-act="f-tcg" data-v="${id}">${esc(l)}</button>`).join("")}</div>
    <div class="chips">${o.map(([id,l])=>`<button class="chip ${S.f.owner===id?"on":""}" data-act="f-owner" data-v="${esc(id)}">${esc(l)}</button>`).join("")}<button class="chip" data-act="add-owner">+ Collector</button></div>
  </div>`;
}

async function sheetPick(file){
  if(!file) return; try{ const blob=await shrink(file,2600,.9); const im=new Image(); const url=URL.createObjectURL(blob); await new Promise((r,j)=>{ im.onload=r; im.onerror=j; im.src=url; });
    S.sheet={url,im,lay:"3x3",cols:3,rows:3,tcg:S.f.tcg!=="all"?S.f.tcg:"pokemon",owner:S.f.owner!=="all"?S.f.owner:S.settings.owners[0],cells:null,busy:false,msg:""}; }
  catch(e){ S.sheet=null; toast("That photo could not be opened. Try another."); } render();
}
function cropCell(sh,i){ return new Promise((res,rej)=>{ const cw=sh.im.width/sh.cols, ch=sh.im.height/sh.rows, x=(i%sh.cols)*cw, y=Math.floor(i/sh.cols)*ch, sc=Math.min(1,1000/Math.max(cw,ch)), c=document.createElement("canvas"); c.width=Math.round(cw*sc); c.height=Math.round(ch*sc); c.getContext("2d").drawImage(sh.im,x,y,cw,ch,0,0,c.width,c.height); c.toBlob(b=>b?res(b):rej(new Error("crop")),"image/jpeg",.88); }); }
function vaultMatch(tcg,name,number){ const n=(name||"").trim().toLowerCase(); if(!n) return null; const num=(number||"").trim().toLowerCase(); const same=cards().filter(c=>c.tcg===tcg&&(c.name||"").trim().toLowerCase()===n); return same.find(c=>num&&(c.number||"").toLowerCase()===num) || (same.length===1&&(!num||!same[0].number)?same[0]:null); }
async function sheetRead(){

  try{ for(let i=0;i<n;i++){ const blob=await cropCell(sh,i); cells.push({blob,url:URL.createObjectURL(blob),name:"",on:true,tcg:sh.tcg}); } }catch(e){ sh.busy=false; sh.msg="The page could not be cut up. Try a smaller photo."; render(); return; }
  if(sample&&sampleImages){
    let maxN=4; try{ const l=await sample.limits(); maxN=Math.max(1,Math.min(9,(l.images&&l.images.maxCount)||4)); }catch(e){}
    for(let st=0; st<n; st+=maxN){
      const part=cells.slice(st,st+maxN); sh.msg=`Claude is reading pockets ${st+1} to ${st+part.length} of ${n}. Each batch can take up to a minute.`; render();
      const prompt=`You are given ${part.length} photos in order. Each is one pocket cut from a binder page of trading cards, most likely ${tcgOf(sh.tcg).label}. Reply with only a JSON array of exactly ${part.length} objects, one per photo in the same order:
{"empty": boolean, "tcg": one of ${JSON.stringify(REF.tcgs.map(t=>t.id))}, "name": string, "set": string, "number": string, "rarity": string, "serialSeen": boolean, "confidence": "high" | "medium" | "low"}
Rules: read only what is visible. Use "" for anything you cannot read. "empty" is true when the pocket holds no card. Never guess a serial number or a price. "number" is the collector number or card code printed on the card. A photo may include slivers of neighbouring cards; describe the card that fills most of it.`;
      try{ const r=await sample.json(prompt,{images:part.map(c=>c.blob),cache:false}); (Array.isArray(r)?r:[]).slice(0,part.length).forEach((g,k)=>{ const c=part[k]; if(!g||typeof g!=="object") return; const str=v=>typeof v==="string"?v.trim():""; c.empty=!!g.empty; c.name=str(g.name); c.set=str(g.set); c.number=str(g.number); c.rarity=str(g.rarity); c.serialSeen=!!g.serialSeen; c.conf=str(g.confidence)||"low"; if(REF.tcgs.some(t=>t.id===g.tcg)) c.tcg=g.tcg; c.on=!c.empty; c.match=vaultMatch(c.tcg,c.name,c.number); }); }
      catch(e){ const code=e&&e.code; if(code==="not_granted"||code==="sampling_disabled"||code==="images_unavailable"){ sh.msg="Card reading is switched off for this visit. Name the pockets by hand."; break; } if(code==="rate_limited"){ sh.msg="Claude is busy. The pockets read so far are below, name the rest by hand or try again later."; break; } }
      sh.done=Math.min(n,st+part.length);
    }
    if(!/switched off|busy/.test(sh.msg)) sh.msg="Check each name against the page before adding. Anything Claude could not read is left blank.";
  } else sh.msg="Pockets cut out. Type a name for each card you want to add.";

}
async function sheetAdd(){

async function rcLoad(){
  if(RCS.busy) return; const todo=rcPending(); RCS.busy=true; RCS.done=0; RCS.total=todo.length; RCS.msg=""; render(); let fail=0; const owner=S.settings.owners[0];
  for(const r of todo){
    const [name,price,set,numRaw,qty,sid]=r, id="rc_"+sid, old=S.cards.get(id), m=String(numRaw).match(/^(.*?)(?:\s+([A-Z]))?$/), ja=/_ja/.test(sid);

      : {id,createdAt:Date.now(),tcg:"pokemon",owner,name,set,number:m?m[1]:numRaw,rarity:m&&m[2]?(RCRAR[m[2]]||m[2]):"",qty,raw:price,rawStatus:price!=null?"estimate":"unverified",bgsStatus:"unverified",serial:"no",decision:"undecided",reasons:[],isHit:price!=null&&price>=20,source:"rarecandy",imageUrl:"https://images.scrydex.com/pokemon/"+sid+"/large",notes:(ja?"Japanese card. ":"")+"Price is the Rare Candy estimate."};
    if(S.mode==="local"){ S.cards.set(id,card); }
    else { const {id:_,...data}=card; data.updatedAt=Date.now(); let ok=false; for(let t=0;t<4&&!ok;t++){ try{ await db.doc("cards/"+id).set(data); ok=true; }catch(e){ if(e&&e.code==="resource_exhausted") await new Promise(z=>setTimeout(z,3000)); else if(e&&e.code==="unavailable") await new Promise(z=>setTimeout(z,1200)); else { t=9; } } } if(!ok) fail++; }

/* ---------- photos ---------- */
function shrink(file,max,q){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file), im=new Image(); im.onload=()=>{ const s=Math.min(1,max/Math.max(im.width,im.height)), c=document.createElement("canvas"); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext("2d").drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",q); }; im.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error("That file is not a photo this browser can open.")); }; im.src=u; }); }
function blobToDataURL(b){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(b); }); }
async function handleScan(file){
  if(!file) return; S.scan={busy:true,msg:"Getting the photo ready."}; render();
  let blob; try{ blob=await shrink(file,1400,.85); }catch(e){ S.scan={busy:false,msg:e.message||"That photo could not be read. Try another."}; render(); return; }
  let guess={}, note="";
  if(sample&&sampleImages){
    S.scan.msg="Claude is reading the card. This can take up to a minute."; render();
    const prompt=`This photo shows one trading card for a family collection tracker. Read only what is visible and reply with only a JSON object:
{"tcg": one of ${JSON.stringify(REF.tcgs.map(t=>t.id))}, "name": string, "character": string, "set": string, "number": string, "rarity": string, "serialVisible": "yes" | "no" | "unclear", "serialNo": string, "serialRun": string, "confidence": "high" | "medium" | "low", "notes": string}
Rules: use "" for anything you cannot read. Never guess a serial number, a print run, or a price. "kpdh" means Kayou KPop Demon Hunters cards. Kayou Naruto card codes look like NRSA03-SE-001 where the middle part is the rarity; put the full code in "number". A serial stamp looks like a small fraction such as 042/220 printed on the card face. "notes" is one short sentence on anything you were unsure about.`;
    try{ const r=await sample.json(prompt,{images:[blob],cache:false}); if(r&&typeof r==="object") guess=r; note = guess.confidence==="high" ? "Claude read this card with high confidence. Check it against the card before saving." : "Claude was not fully sure about this one. Check every field against the card."; if(guess.notes) note+=" "+String(guess.notes); }
    catch(e){ const c=e&&e.code; note = c==="not_granted"||c==="sampling_disabled" ? "Card reading is switched off for this visit, so fill in the details by hand." : c==="rate_limited" ? "Claude is busy right now. The photo is attached, fill in the details by hand or try again in a bit." : "Claude could not read that photo. The photo is attached, fill in the details by hand."; }
  } else note="Photo attached. Fill in the details from the card.";
  S.scan={busy:false,msg:""}; pendingPhoto=blob;
  const str=v=>typeof v==="string"?v.trim():"";
  const c={tcg:REF.tcgs.some(t=>t.id===guess.tcg)?guess.tcg:(S.f.tcg!=="all"?S.f.tcg:"naruto"),name:str(guess.name),character:str(guess.character),set:str(guess.set),number:str(guess.number),rarity:str(guess.rarity),
    serial: guess.serialVisible==="yes"&&str(guess.serialNo) ? "yes" : guess.serialVisible==="no" ? "no" : "unverified", serialNo:str(guess.serialNo), serialRun:str(guess.serialRun), source:"scan", isHit:true, notes:""};
  cardSheet(c,true); pendingPhoto=blob; drawCardSheet(); if(note) toast(note);
  const n=document.createElement("div"); n.className="note"; n.textContent=note; $("#cardForm").insertBefore(n,$("#cardForm").children[1]);
}

async function doSearch(){
  const s=S.search; s.q=($("#sq")||{}).value||s.q; s.tcg=($("#stcg")||{}).value||s.tcg; const q=s.q.trim(); if(!q){ toast("Type something to search for."); return; }

    try{
      if(s.tcg==="pokemon"){ const r=await fetch("https://api.pokemontcg.io/v2/cards?pageSize=30&orderBy=-set.releaseDate&q="+encodeURIComponent('name:"'+q.replace(/"/g,"")+'*"')); const j=await r.json();
        out=(j.data||[]).map(c=>{ const pr=c.tcgplayer&&c.tcgplayer.prices?Object.values(c.tcgplayer.prices).map(p=>p.market).filter(Boolean):[]; return {tcg:"pokemon",name:c.name,set:c.set&&c.set.name,number:c.number+(c.set&&c.set.printedTotal?"/"+c.set.printedTotal:""),rarity:c.rarity||"",imageUrl:c.images&&c.images.small,raw:pr.length?Math.max(...pr):null}; }); }
      else { const r=await fetch("https://db.ygoprodeck.com/api/v7/cardinfo.php?num=30&offset=0&fname="+encodeURIComponent(q)); const j=await r.json();
        out=(j.data||[]).map(c=>{ const cs=(c.card_sets||[])[0]||{}, p=(c.card_prices||[])[0]||{}; return {tcg:"yugioh",name:c.name,set:cs.set_name||"",number:cs.set_code||"",rarity:cs.set_rarity||"",imageUrl:(c.card_images||[])[0]&&c.card_images[0].image_url_small,raw:num(p.tcgplayer_price)||null}; }); }
      S.net="open";
    }catch(e){ S.net="blocked"; out=null; }
  }
  if(out===null){
    if(sample){
      try{ const r=await sample.json(`List up to 8 real ${tcgOf(s.tcg).label} trading cards that match the search "${q.slice(0,80)}". Reply with only a JSON array of {"name": string, "set": string, "number": string, "rarity": string} objects. Only include cards you are confident exist; use "" for a field you are not sure of. No prices. If you know none, reply [].`,{modelTier:"quick"});
        out=(Array.isArray(r)?r:[]).filter(x=>x&&x.name).slice(0,8).map(x=>({tcg:s.tcg,name:String(x.name),set:String(x.set||""),number:String(x.number||""),rarity:String(x.rarity||""),raw:null}));
        s.note="These catalog matches come from Claude's general knowledge, with no pictures or prices. Check them against the card in your hand."; }
      catch(e){ out=[]; s.note="The catalog could not be searched right now. You can still add the card by hand or scan it."; }
    } else { out=[]; s.note = (s.tcg==="pokemon"||s.tcg==="yugioh") ? "The live catalog could not be reached. Add the card by hand or scan it." : "There is no public catalog for this game yet. Add the card by hand or scan it."; }
  }
  s.results=out; s.busy=false; render();
}

/* ---------- import / export ---------- */
function parseCSV(text){
  const delim = text.split("\n")[0].includes("\t") ? "\t" : ","; const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i]; if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; } else if(ch==='"') q=true; else if(ch===delim){ row.push(cur); cur=""; } else if(ch==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; } else if(ch!=="\r") cur+=ch; }
  if(cur||row.length){ row.push(cur); rows.push(row); } return rows.filter(r=>r.some(c=>c.trim()));
}
function mapRows(rows){
  if(rows.length<2) return []; const hd=rows[0].map(h=>h.trim().toLowerCase());
  const col=(...keys)=>{ for(const k of keys){ const i=hd.findIndex(h=>h===k); if(i>=0) return i; } for(const k of keys){ const i=hd.findIndex(h=>h.includes(k)); if(i>=0) return i; } return -1; };
  const ix={name:col("name","card name","card","product name","title"),set:col("set","set name","expansion","series"),number:col("number","card number","no.","collector number","#"),qty:col("quantity","qty","count","owned"),cond:col("condition","grade"),rar:col("rarity"),price:col("market price","price","value","market","unit price")};
  if(ix.name<0) return [];
  return rows.slice(1).map(r=>({name:(r[ix.name]||"").trim(),set:ix.set>=0?(r[ix.set]||"").trim():"",number:ix.number>=0?(r[ix.number]||"").trim():"",qty:Math.max(1,Math.round(num(ix.qty>=0?r[ix.qty]:1)||1)),condition:ix.cond>=0?(r[ix.cond]||"").trim():"",rarity:ix.rar>=0?(r[ix.rar]||"").trim():"",raw:ix.price>=0?num(r[ix.price]):null})).filter(r=>r.name);
}

  const f=$("#impFile").files[0]; let text=$("#impText").value; if(f){ try{ text=await f.text(); }catch(e){ S.imp.msg="That file could not be read."; render(); return; } }
  S.imp.tcg=$("#impTcg").value; S.imp.owner=$("#impOwner").value;
  const rows=mapRows(parseCSV(text||"")); S.imp.rows=rows.length?rows:null; S.imp.msg=rows.length?`Found ${rows.length} cards, ${rows.reduce((a,r)=>a+r.qty,0)} copies.`:"No rows found. The first line needs a header with at least a name column."; render();

async function impGo(){

  const mk=r=>({id:uid("c_"),createdAt:Date.now(),tcg:im.tcg,owner:im.owner,name:r.name,set:r.set,number:r.number,qty:r.qty,rarity:r.rarity,raw:r.raw,rawStatus:r.raw!=null?"estimate":"unverified",bgsStatus:"unverified",serial:"no",decision:"undecided",reasons:[],notes:r.condition?"Condition: "+r.condition:"",source:"import"});
  if(S.mode==="local"){ im.rows.forEach(r=>{ const c=mk(r); S.cards.set(c.id,c); }); saveLocal(); im.done=im.total; }
  else { for(const r of im.rows){ const c=mk(r), {id,...data}=c; let ok=false; for(let t=0;t<2&&!ok;t++){ try{ await db.doc("cards/"+id).set(data); ok=true; }catch(e){ if(e&&e.code==="resource_exhausted") await new Promise(z=>setTimeout(z,2500)); else break; } } if(!ok) fail++; im.done++; if(im.done%10===0){ const p=document.querySelector("progress"); if(p) p.value=im.done; } } }

  else if(t.id==="sheetTcg"){ S.sheet.tcg=t.value; }
  else if(t.id==="sheetOwner"){ S.sheet.owner=t.value; }
  else if(t.dataset.act==="cell-on"){ document.querySelectorAll("[data-cell]").forEach(el=>{ S.sheet.cells[+el.dataset.cell].name=el.value.trim(); }); S.sheet.cells[+t.dataset.i].on=t.checked; render(); }
  else if(t.id==="cPhoto"){ const f=t.files[0]; if(f) shrink(f,1400,.85).then(b=>{ readCardForm(); pendingPhoto=b; drawCardSheet(); }).catch(()=>toast("That photo could not be read.")); }
  else if(t.id==="cTcg"){ readCardForm(); drawCardSheet(); }
  else if(t.id==="serialCard"){ S.serialCard=t.value; S.serialTicks={}; render(); }
  else if(t.dataset.act==="tick"){ S.serialTicks[t.dataset.i]=t.checked; render(); }
  else if(t.id==="stcg"){ S.search.tcg=t.value; S.search.results=null; S.search.note=""; S.search.q=$("#sq").value; render(); }
});
let qt; document.addEventListener("input", e=>{ if(e.target.id==="q"){ S.f.q=e.target.value; clearTimeout(qt); qt=setTimeout(()=>{ S.more=60; render(); const el=$("#q"); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } },250); } });
document.addEventListener("keydown", e=>{ if(e.key==="Enter"&&e.target.id==="sq"){ e.preventDefault(); doSearch(); } if(e.key==="Escape"&&sheetOpen()) closeSheet(); });
let rz; addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(drawFoil,150); });

async function seedNaruto(){
  const base={tcg:"naruto",set:"Chapter Jin Series 3",packs:5,cardsPerPack:8,price:null,retailer:"",packsOpened:0}, t=Date.now();
  const list=[{...base,id:"p_jin3_box1",name:"Chapter Jin Series 3 Collector Box #1",state:"opened",ship:"unknown",resolution:"none",packsOpened:5,createdAt:t,notes:"Opened. Add the price, how it arrived, and log the pulls."},
    {...base,id:"p_jin3_box2",name:"Chapter Jin Series 3 Collector Box #2",state:"opened",ship:"unknown",resolution:"none",packsOpened:5,createdAt:t+1,notes:"Opened. Add the price, how it arrived, and log the pulls."},
    {...base,id:"p_jin3_replacement",name:"Chapter Jin Series 3 Collector Box (replacement)",state:"incoming",ship:"not-arrived",resolution:"replacement-shipped",createdAt:t+2,notes:"Replacement still on the way. Mark it arrived, then log each pack as you open it."}];

}
